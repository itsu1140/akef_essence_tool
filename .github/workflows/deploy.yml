name: Deploy

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract ROOT_PATH from docker-compose.yml
              id: config
              run: |
                  root_path=$(grep 'ROOT_PATH=' docker-compose.yml | cut -d= -f2)
                  echo "root_path=${root_path}" >> $GITHUB_OUTPUT

            - name: Build Docker image
              run: docker build -t akef-app:latest --build-arg ROOT_PATH=${{ steps.config.outputs.root_path }} .

            - name: Save Docker image
              run: docker save akef-app:latest | gzip > image.tar.gz

            - name: Copy image to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  port: ${{ secrets.SSH_PORT }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  source: "image.tar.gz,docker-compose.yml"
                  target: ${{ secrets.WORK_DIR }}

            - name: Deploy on server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  port: ${{ secrets.SSH_PORT }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd ${{ secrets.WORK_DIR }}
                      docker load < image.tar.gz
                      docker compose up -d
                      rm image.tar.gz
